name: Release

# A release tag builds the Windows installer from the audited source export and creates a draft.
on:
  push:
    tags: ['v*', '!v0.2.1']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check the tag matches package.json
        id: version
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match package.json version $version" }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Export audited public source
        id: source
        run: |
          $output = node scripts/package-public-release.js --current
          $output
          if ($LASTEXITCODE -ne 0) { throw 'Public source export failed.' }
          $prefix = 'Source tree '
          $directories = @($output | Where-Object { $_.StartsWith($prefix) })
          if ($directories.Count -ne 1) { throw 'Expected one public source directory.' }
          $directory = $directories[0].Substring($prefix.Length)
          $directory = (Resolve-Path -LiteralPath $directory).Path
          "directory=$directory" >> $env:GITHUB_OUTPUT
      - name: Install audited source dependencies
        working-directory: ${{ steps.source.outputs.directory }}
        run: npm ci
        env:
          # electron-builder downloads its own Electron build; skip the dev binary.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Check audited source
        working-directory: ${{ steps.source.outputs.directory }}
        run: npm run check
      - name: Build the Windows installer
        working-directory: ${{ steps.source.outputs.directory }}
        run: npm run dist
        env:
          # Optional. When these secrets are absent the build is unsigned.
          # CSC_LINK: base64-encoded .pfx or an https URL; CSC_KEY_PASSWORD: its password.
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Collect release assets
        env:
          SOURCE_TREE: ${{ steps.source.outputs.directory }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          $build = Join-Path $env:SOURCE_TREE 'out'
          $installer = Join-Path $build "Lastra-Setup-$env:RELEASE_VERSION.exe"
          $source = Join-Path $env:GITHUB_WORKSPACE "dist/lastra-$env:RELEASE_VERSION-source.zip"
          $files = @($installer, "$installer.blockmap", (Join-Path $build 'latest.yml'), $source, "$source.sha256")
          $destination = New-Item -ItemType Directory -Path 'dist/release' -Force
          Copy-Item -LiteralPath $files -Destination $destination.FullName
      - name: Keep the release bundle as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: lastra-windows-${{ github.ref_name }}
          path: dist/release/
          if-no-files-found: error
      - name: Create the draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $repo = $env:GITHUB_REPOSITORY
          gh release view $tag --repo $repo --json isDraft 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "Release $tag already exists. The workflow artifact contains this build."
            exit 0
          }
          $files = @(Get-ChildItem -LiteralPath 'dist/release' -File | Select-Object -ExpandProperty FullName)
          gh release create $tag --repo $repo --verify-tag --draft --title "Lastra $tag" --generate-notes @files
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
