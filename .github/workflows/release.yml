name: Windows release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Build and verify the Windows installer
        run: ./scripts/release-windows.ps1 -Tag $env:GITHUB_REF_NAME
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Save the release files
        uses: actions/upload-artifact@v4
        with:
          name: lastra-windows-${{ github.ref_name }}
          path: |
            out/Lastra-Setup-*.exe
            out/Lastra-Setup-*.exe.blockmap
            out/Lastra-Setup-*.exe.sha256
            out/latest.yml
          if-no-files-found: error
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.Substring(1)
          $installer = "out/Lastra-Setup-$version.exe"
          $files = @($installer, "$installer.blockmap", "$installer.sha256", 'out/latest.yml')
          $existing = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft,assets 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $existing | ConvertFrom-Json
            $missing = $files | Where-Object { (Split-Path -Leaf $_) -notin $release.assets.name }
            if ($release.isDraft -and $missing) {
              gh release upload $tag @files --repo $env:GITHUB_REPOSITORY --clobber
              exit $LASTEXITCODE
            }
            Write-Host "A release already exists for $tag with its assets and notes."
            exit 0
          }
          gh release create $tag @files `
            --repo $env:GITHUB_REPOSITORY --draft --verify-tag --title "Lastra $tag" --notes-from-tag
          exit $LASTEXITCODE
