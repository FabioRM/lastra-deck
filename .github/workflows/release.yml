name: Desktop release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Build and verify the Windows installer
        run: ./scripts/release-windows.ps1 -Tag $env:GITHUB_REF_NAME
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: lastra-windows
          path: |
            out/Lastra-Setup-*.exe
            out/Lastra-Setup-*.exe.blockmap
            out/Lastra-Setup-*.exe.sha256
            out/latest.yml
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools
          npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Check Linux profiles and build the distribution packages
        run: |
          node --test test/linux-deck.test.js
          sh scripts/release-linux.sh "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: lastra-linux
          path: |
            out/Lastra-*-linux-*.deb
            out/Lastra-*-linux-*.AppImage
            out/Lastra-*-linux-*.sha256
            out/lastra-wayland@fabiorm.github.io.zip
            out/lastra-wayland@fabiorm.github.io.zip.sha256
          if-no-files-found: error

  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: lastra-*
          path: release-files
          merge-multiple: true
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --json isDraft > /dev/null 2>&1; then
            if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true ]; then
              gh release upload "$tag" release-files/* --clobber
            fi
          else
            git for-each-ref --format='%(contents)' "refs/tags/$tag" |
              gh release create "$tag" release-files/* --draft --verify-tag --title "Lastra $tag" --notes-file -
          fi
