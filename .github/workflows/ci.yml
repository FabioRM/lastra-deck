name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Lastra uses Windows Core Audio, SendInput and PowerShell; several tests only run on Windows.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
        env:
          # The tests do not start Electron; skip its ~100 MB binary download.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
